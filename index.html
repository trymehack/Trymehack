<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Suhail Tanweer Tapadar - Cybersecurity Enthusiast from Assam, India. Personal cybersecurity learning portfolio.">

<meta name="keywords"
content="Suhail Tanweer Tapadar, cybersecurity, ethical hacking, cyber security, Assam, India, TryHackMe, networking, web security">

content="Suhail Tanweer Tapadar">

<title>Suhail Tanweer Tapadar | Cybersecurity Enthusiast</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050d1d;
    color: #e8f1ff;
    line-height: 1.7;
}


/* =========================
   AUTHENTICATION SCREEN
========================= */

#authScreen {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            #102d55,
            #050d1d 55%
        );
}


.auth-box {

    width: 100%;

    max-width: 420px;

    background: #0b1830;

    border: 1px solid #263b63;

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);

    text-align: center;
}


.auth-logo {

    font-size: 28px;

    font-weight: bold;

    color: #55c9ff;

    margin-bottom: 8px;
}


.auth-subtitle {

    color: #9fb2d3;

    font-size: 14px;

    margin-bottom: 28px;
}


.auth-box h2 {

    color: #ffffff;

    margin-bottom: 20px;
}


.auth-input {

    width: 100%;

    padding: 14px 15px;

    margin-bottom: 15px;

    background: #071225;

    border: 1px solid #29466f;

    border-radius: 9px;

    outline: none;

    color: white;

    font-size: 15px;
}


.auth-input:focus {

    border-color: #55c9ff;

    box-shadow:
        0 0 0 2px rgba(85,201,255,0.1);
}


.auth-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 9px;

    background: #55c9ff;

    color: #050d1d;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;

    transition: 0.3s;
}


.auth-button:hover {

    background: #8bdcff;

    transform: translateY(-2px);
}


.auth-button:active {

    transform: translateY(0);
}


.switch-text {

    margin-top: 20px;

    color: #9fb2d3;

    font-size: 14px;
}


.switch-button {

    color: #55c9ff;

    cursor: pointer;

    font-weight: bold;
}


.switch-button:hover {

    text-decoration: underline;
}


.auth-message {

    margin-top: 15px;

    font-size: 14px;

    min-height: 22px;
}


.password-note {

    color: #7186a9;

    font-size: 12px;

    margin-top: 10px;
}


/* =========================
   WEBSITE
========================= */

#website {

    display: none;
}


/* =========================
   HEADER
========================= */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    background:
        rgba(5, 13, 29, 0.96);

    border-bottom:
        1px solid #263b63;

    backdrop-filter:
        blur(10px);
}


nav {

    max-width: 1100px;

    margin: auto;

    padding: 18px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;
}


.logo {

    color: #55c9ff;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 1px;
}


nav a {

    color: #dcecff;

    text-decoration: none;

    margin-left: 18px;

    font-size: 15px;
}


nav a:hover {

    color: #55c9ff;
}


.logout-button {

    margin-left: 18px;

    padding: 7px 12px;

    border: 1px solid #55c9ff;

    background: transparent;

    color: #55c9ff;

    border-radius: 6px;

    cursor: pointer;
}


.logout-button:hover {

    background: #55c9ff;

    color: #050d1d;
}


/* =========================
   HERO
========================= */

.hero {

    max-width: 1100px;

    margin: auto;

    padding: 100px 20px 80px;

    text-align: center;
}


.hero h1 {

    font-size:
        clamp(38px, 8vw, 70px);

    line-height: 1.15;

    margin-bottom: 20px;
}


.hero h1 span {

    color: #55c9ff;
}


.hero .subtitle {

    font-size: 22px;

    color: #b9c9e8;

    margin-bottom: 15px;
}


.hero .description {

    max-width: 750px;

    margin: auto;

    color: #9fb2d3;

    font-size: 17px;
}


.button {

    display: inline-block;

    margin-top: 30px;

    padding: 13px 25px;

    border: 1px solid #55c9ff;

    border-radius: 8px;

    color: #55c9ff;

    text-decoration: none;

    font-weight: bold;

    transition: 0.3s;
}


.button:hover {

    background: #55c9ff;

    color: #050d1d;
}


/* =========================
   SECTIONS
========================= */

section {

    max-width: 1100px;

    margin: auto;

    padding: 70px 20px;
}


section h2 {

    color: #55c9ff;

    font-size: 34px;

    margin-bottom: 30px;

    text-align: center;
}


/* =========================
   ABOUT
========================= */

.about-intro {

    text-align: center;

    max-width: 850px;

    margin: auto;
}


.about-intro p {

    color: #b9c9e8;

    font-size: 17px;

    margin-bottom: 18px;
}


/* =========================
   LEARNING
========================= */

.learning-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 20px;
}


.learning-card {

    background: #0b1830;

    border:
        1px solid #263b63;

    border-radius: 15px;

    padding: 25px;

    transition: 0.3s;
}


.learning-card:hover {

    transform: translateY(-4px);

    border-color: #55c9ff;
}


.learning-card h3 {

    color: #55c9ff;

    margin-bottom: 10px;
}


.learning-card p {

    color: #b9c9e8;
}


/* =========================
   SKILLS
========================= */

.skills {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap: 16px;
}


.skill {

    background: #0d1d39;

    border:
        1px solid #29466f;

    border-radius: 12px;

    padding: 20px;

    text-align: center;

    color: #dcecff;

    transition: 0.3s;
}


.skill:hover {

    transform: translateY(-4px);

    border-color: #55c9ff;
}


.skill-icon {

    font-size: 28px;

    margin-bottom: 8px;
}


/* =========================
   CERTIFICATES
========================= */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(300px, 1fr)
        );

    gap: 25px;
}


.gallery-card {

    background: #0b1830;

    border:
        1px solid #263b63;

    border-radius: 16px;

    padding: 15px;

    overflow: hidden;
}


.gallery-card img {

    width: 100%;

    height: auto;

    display: block;

    border-radius: 10px;

    background: #020711;
}


.gallery-card h3 {

    color: #ffffff;

    font-size: 21px;

    margin-top: 18px;

    margin-bottom: 8px;
}


.gallery-card p {

    color: #aebed9;

    font-size: 15px;
}


/* =========================
   ARTICLE
========================= */

.article {

    background: #0b1830;

    border:
        1px solid #263b63;

    border-radius: 16px;

    padding: 35px;
}


.article h3 {

    color: #55c9ff;

    font-size: 25px;

    margin-bottom: 15px;
}


.article p {

    color: #c4d2e9;

    margin-bottom: 20px;
}


.article ul {

    margin-left: 25px;

    color: #c4d2e9;
}


.article li {

    margin-bottom: 8px;
}


/* =========================
   GOALS
========================= */

.goals {

    text-align: center;

    max-width: 850px;

    margin: auto;
}


.goals p {

    color: #b9c9e8;

    font-size: 17px;

    margin-bottom: 15px;
}


/* =========================
   FOOTER
========================= */

footer {

    background: #030915;

    border-top:
        1px solid #263b63;

    text-align: center;

    padding: 40px 20px;

    color: #91a4c5;
}


footer strong {

    color: #55c9ff;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    nav {

        flex-direction: column;

        text-align: center;
    }


    nav a {

        margin: 0 5px;

        font-size: 14px;
    }


    .logout-button {

        margin-left: 5px;

        margin-top: 8px;
    }


    .hero {

        padding-top: 65px;
    }


    .hero h1 {

        font-size: 42px;
    }


    .hero .subtitle {

        font-size: 19px;
    }


    section {

        padding: 55px 16px;
    }


    section h2 {

        font-size: 29px;
    }


    .article {

        padding: 22px;
    }


    .auth-box {

        padding: 25px 20px;
    }

}

</style>

</head>

        <div class="auth-logo">

            SUHAIL TANWEER TAPADAR

        </div>


        <p class="auth-subtitle">

        <div id="loginForm">

                id="loginMobile"
                class="auth-input"
                placeholder="Mobile Number"

            <input
                type="password"
                id="loginPassword"
                class="auth-input"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button
                type="button"

                Login

                    Sign Up

                </span>

        </div>

             SIGN UP FORM
        ========================== -->


        <div

            <input

                id="signupMobile"
                class="auth-input"
                placeholder="Mobile Number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
            >


            <input
                type="password"
                id="signupPassword"
                class="auth-input"
                placeholder="Create Password"
                autocomplete="new-password"
            >


            <input
                type="password"
                id="signupConfirmPassword"
                class="auth-input"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >


            <button
                type="button"
                class="auth-button"
                onclick="signup()"

                Create Account

            </button>


            <p
